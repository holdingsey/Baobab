services:
  - type: web
    name: baobab-distribution
    env: static
    buildCommand: export NODE_OPTIONS="--max-old-space-size=460" && npm install --no-audit --no-fund --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
